<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Poster Studio — GTA 6-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>VICE POSTER STUDIO</h1>
    <p>Turn any photo into GTA 6-style cover art. Offline, in your browser.</p>
  </div>
  <div class="top-actions">
    <button id="undoBtn" type="button">Undo</button>
    <button id="surpriseBtn" type="button">Surprise me</button>
  </div>
</header>
<main class="app">
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <noscript><p>This cover maker needs JavaScript to draw the cover.</p></noscript>
    <div class="exportbar">
      <label>Export size <select id="exportSize"></select></label>
      <button id="exportBtn" type="button">Export PNG</button>
      <button id="exportAllBtn" type="button">Export all sizes</button>
    </div>
    <p id="status" role="status"></p>
    <p class="hint">Shortcuts: 1–5 layout · E export · S surprise · Ctrl+Z undo. Pick a sample or upload your own photo.</p>
  </section>
  <aside class="controls">
    <section class="panel">
      <h2>Photo</h2>
      <div id="sampleRow" class="samples"></div>
      <label class="upload">Upload your photo <input id="upload" type="file" accept="image/*"></label>
    </section>
    <section class="panel">
      <h2>Layout</h2>
      <div id="layoutRow" class="chips"></div>
    </section>
    <section class="panel">
      <h2>Grade</h2>
      <div id="gradeRow" class="chips"></div>
      <label>Duotone
        <select id="duotone">
          <option value="none">None</option>
          <option value="sunset">Sunset</option>
          <option value="teal">Vice Teal</option>
          <option value="magenta">Magenta</option>
        </select>
      </label>
      <label><input id="halftone" type="checkbox"> Halftone dots</label>
      <label><input id="grain" type="checkbox" checked> Film grain</label>
      <label><input id="vignette" type="checkbox" checked> Vignette</label>
      <label><input id="dressing" type="checkbox" checked> Cover dressing</label>
    </section>
    <section class="panel">
      <h2>Caption</h2>
      <label>Title <input id="titleInput" type="text" maxlength="40" value="GOLDEN HOUR GETAWAY"></label>
      <label>Script line <input id="scriptInput" type="text" maxlength="60" value="running on golden light"></label>
      <label>Location <input id="locationInput" type="text" maxlength="24" value="LEONIDA"></label>
      <label>Ribbon <input id="ribbonInput" type="text" maxlength="24" value="NO TURNING BACK"></label>
    </section>
    <section class="panel">
      <h2>Selected panel</h2>
      <label>Panel <select id="panelSelect"></select></label>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"> <span id="zoomVal">1</span></label>
      <label>Pan X <input id="panX" type="range" min="-50" max="50" step="1" value="0"> <span id="panXVal">0</span></label>
      <label>Pan Y <input id="panY" type="range" min="-50" max="50" step="1" value="0"> <span id="panYVal">0</span></label>
      <label>Rotate <input id="rotate" type="range" min="-30" max="30" step="1" value="0"> <span id="rotateVal">0</span>&deg;</label>
      <label><input id="flip" type="checkbox"> Flip horizontal</label>
      <label>Brightness <input id="bright" type="range" min="40" max="160" step="1" value="100"> <span id="brightVal">100</span></label>
      <label>Contrast <input id="contrast" type="range" min="40" max="160" step="1" value="100"> <span id="contrastVal">100</span></label>
      <label>Saturation <input id="sat" type="range" min="0" max="200" step="1" value="100"> <span id="satVal">100</span></label>
      <label>Panel caption <input id="panelCaption" type="text" maxlength="30" placeholder="Optional mini caption"></label>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
